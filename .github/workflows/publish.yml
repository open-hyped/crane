name: Publish Python 🐍 distribution 📦 to PyPI

on:
  # `push`, not `create`: the create event takes no ref filter - GitHub ignores the
  # `tags` list rather than rejecting it, so every branch creation fired a publish too.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

# One publish per tag. Two runs for the same tag race each other into PyPI, and the
# loser fails on a version the winner has already uploaded.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build distribution 📦
    runs-on: ubuntu-latest

    outputs:
      is_local: ${{ steps.check_version.outputs.is_local }}

    steps:
    - uses: actions/checkout@v4
      with:
        persist-credentials: false
        # setuptools_scm derives the version from git tags; a shallow clone
        # without tags makes it fall back to a local dev version (e.g.
        # "0.1.dev1+g<hash>") that PyPI rejects. Fetch full history and tags.
        fetch-depth: 0
        fetch-tags: true
    - name: Check the tag is on main
      # A tag names a commit, not a branch, so the `tags` filter above cannot say which
      # branch it came from - a tag pushed from a feature branch would publish it. The
      # commit has to be an ancestor of main to count as released.
      run: |
        git fetch --no-tags --depth=1 origin main
        if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
          echo "::error::Tag $GITHUB_REF_NAME points at a commit that is not on main; refusing to publish."
          exit 1
        fi

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.x"
    - name: Install pypa/build
      run: >-
        python3 -m
        pip install
        build
        --user
    - name: Build a binary wheel and a source tarball
      run: python3 -m build
    - name: Check for local version
      id: check_version
      # A PEP 440 local version identifier is the part after "+" in the version.
      # PyPI refuses uploads containing one, so detect it here and expose the
      # result to gate the publish job below.
      run: |
        version=$(python3 -c "import glob, os; print(os.path.basename(glob.glob('dist/*.whl')[0]).split('-')[1])")
        echo "Built version: $version"
        if [[ "$version" == *"+"* ]]; then
          echo "is_local=true" >> "$GITHUB_OUTPUT"
          echo "::warning::Built version '$version' contains a local segment; skipping PyPI upload."
        else
          echo "is_local=false" >> "$GITHUB_OUTPUT"
        fi
    - name: Store the distribution packages
      uses: actions/upload-artifact@v4
      with:
        name: python-package-distributions
        path: dist/

  publish-to-pypi:
    name: Publish Python 🐍 distribution 📦 to PyPI
    needs:
    - build
    # never attempt to upload a local version — PyPI rejects it with a 400
    if: needs.build.outputs.is_local == 'false'
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/hyped-crane

    permissions:
      id-token: write

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Publish distribution 📦 to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    name: >-
      Sign the Python 🐍 distribution 📦 with Sigstore
      and upload them to GitHub Release
    needs:
    - publish-to-pypi
    runs-on: ubuntu-latest

    permissions:
      contents: write  # IMPORTANT: mandatory for making GitHub Releases
      id-token: write  # IMPORTANT: mandatory for sigstore

    steps:
    - name: Download all the dists
      uses: actions/download-artifact@v4
      with:
        name: python-package-distributions
        path: dist/
    - name: Sign the dists with Sigstore
      uses: sigstore/gh-action-sigstore-python@v3.0.0
      with:
        inputs: >-
          ./dist/*.tar.gz
          ./dist/*.whl
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      run: >-
        gh release create
        "$GITHUB_REF_NAME"
        --repo "$GITHUB_REPOSITORY"
        --verify-tag
        --notes-from-tag
    - name: Upload artifact signatures to GitHub Release
      env:
        GITHUB_TOKEN: ${{ github.token }}
      # Upload to GitHub Release using the `gh` CLI.
      # `dist/` contains the built packages, and the
      # sigstore-produced signatures and certificates.
      run: >-
        gh release upload
        "$GITHUB_REF_NAME" dist/**
        --repo "$GITHUB_REPOSITORY"